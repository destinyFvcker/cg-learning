[workspace]
# 从0.10版本开始，wgpu就需要使用Cargo最新的功能解析器，这是2021版本（或者任何使用Rust 1.56.0或更新版本创建的新项目）的默认配置。
resolver = "3"
members = ["opengl-programming-guide", "utils", "wgpu-intro"]

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
cgmath = "0.18"
env_logger = "0.11.11"
glutin = "0.32.3"
# image包含的jpeg解码器使用rayon通过线程加速解码。但是WASM目前并不支持线程，因此在这里禁用
# 此功能，以确保在Web上加载jpeg的时候代码不会崩溃
image = {
  version = "0.24",
  default-features = false,
  features = [
    "jpeg",
    "png",
  ]
}
log = "0.4"
nalgebra = "0.35.0"
parking_lot = "0.12.5"
pollster = "0.4.0"
softbuffer = "0.4.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tracing-web = "0.1.3"
wgpu = "30.0.0"
winit = { version = "0.30", features = ["android-native-activity"] }
